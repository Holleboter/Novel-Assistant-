[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-assistant"
version = "0.1.0"
description = "MVP core models and settings for Novel Assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "langgraph",
    "neo4j",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
